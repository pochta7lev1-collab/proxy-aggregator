name: Update Proxy Subscriptions

on:
  schedule:
    # Запуск каждые 4 часа
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-subscriptions
  cancel-in-progress: true

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Xray-core for Reality Deep Validation
        run: |
          XRAY_VER="v24.12.18"
          echo "Installing Xray-core ${XRAY_VER}..."
          curl -sL "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VER}/Xray-linux-64.zip" -o /tmp/xray.zip
          sudo unzip -o -q /tmp/xray.zip xray -d /usr/local/bin/
          sudo chmod +x /usr/local/bin/xray
          xray version

      - name: Execute Aggregator and Deep Reality Verification
        env:
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
        run: |
          python main.py

      - name: Publish Subscription to Output Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cp sub.txt /tmp/sub.txt

          if git ls-remote --exit-code --heads origin output; then
            git checkout output
          else
            git checkout --orphan output
            git rm -rf .
          fi

          cp /tmp/sub.txt sub.txt
          git add sub.txt

          if git diff --staged --quiet; then
            echo "No subscription updates detected. Clean tree."
          else
            git commit -m "chore(sub): update verified proxy list [skip ci]"
            git push origin output
          fi
