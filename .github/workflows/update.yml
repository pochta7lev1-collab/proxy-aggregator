name: Update Proxy Subscriptions

on:
  schedule:
    # Запуск каждые 4 часа: 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-subscriptions
  cancel-in-progress: true

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Aggregation & Testing
        env:
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
          MAX_CONCURRENT_CHECKS: 200
          TCP_TIMEOUT_SECONDS: 3.0
          MAX_LATENCY_MS: 1500.0
        run: |
          python main.py

      - name: Publish Subscription to Output Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Временно сохраняем сгенерированный файл подписки
          cp sub.txt /tmp/sub.txt

          # Проверяем наличие ветки output в удалённом репозитории
          if git ls-remote --exit-code --heads origin output; then
            git checkout output
          else
            git checkout --orphan output
            git rm -rf .
          fi

          # Копируем свежий sub.txt
          cp /tmp/sub.txt sub.txt
          git add sub.txt

          # Коммит и отправка только при наличии изменений
          if git diff --staged --quiet; then
            echo "No subscription updates detected. Clean tree."
          else
            git commit -m "chore(sub): update proxy list [skip ci]"
            git push origin output
          fi
